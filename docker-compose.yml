name: mpbridge

# Values come from .env and can be overridden for each build.
x-versions:
  micropython: &mp-version v${MP_VERSION}
  python: &py-version ${PYTHON_VERSION}
  bridge: &bridge-version ${MP_VERSION}.${BRIDGE_REVISION}
  image: &image ${IMAGE_REPOSITORY}:${MP_VERSION}.${BRIDGE_REVISION}

services:
  mpbridge:
    container_name: mpbridge
    build:
      context: .
      args:
        MICROPYTHON_VERSION: *mp-version
        PYTHON_VERSION: *py-version
        BRIDGE_VERSION: *bridge-version
    image: *image
    ports:
      - "2217:2217"
      - "2218:2218"
    restart: unless-stopped
